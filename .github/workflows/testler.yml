name: Testler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Birim testleri
        run: python -m pytest -v
      - name: Uçtan uca duman testi (2 seed, animasyonsuz)
        run: python main.py --hepsi --tekrar 2 --gif-yok
